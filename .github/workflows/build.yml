name: Compiler le minage et l'application

# Un seul lancement fait tout : compile le programme de minage, l'intègre
# à l'application, fabrique l'APK et le publie dans « Releases ».

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "Adresse VRSC (laisse vide pour utiliser la variable VRSC_WALLET du dépôt)"
        required: false
        default: ""
      ccminer_ref:
        description: "Code de ccminer à compiler (branche ou numéro de commit)"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  miner:
    name: Programme de minage (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le NDK Android
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Installer les outils de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config make git

      - name: Récupérer les bibliothèques déjà compilées (cache)
        id: depscache
        uses: actions/cache/restore@v4
        with:
          path: miner/work/${{ matrix.abi }}/prefix
          key: deps-v1-${{ matrix.abi }}-openssl3.0.15-curl8.9.1-jansson2.14

      - name: Compiler
        env:
          ABI: ${{ matrix.abi }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CCMINER_REF: ${{ inputs.ccminer_ref }}
        run: bash miner/build-android.sh

      - name: Sauvegarder les bibliothèques compilées (cache)
        if: ${{ always() && steps.depscache.outputs.cache-hit != 'true' && hashFiles('miner/work/**/deps-done.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: miner/work/${{ matrix.abi }}/prefix
          key: deps-v1-${{ matrix.abi }}-openssl3.0.15-curl8.9.1-jansson2.14

      - name: Garder les programmes compilés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miner-${{ matrix.abi }}
          path: miner/out/*
          if-no-files-found: ignore

      - name: Garder les journaux (pour comprendre une erreur)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.abi }}
          path: miner/logs/*
          if-no-files-found: ignore

  app:
    name: Application Android (APK)
    needs: miner
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Récupérer les programmes de minage compilés
        uses: actions/download-artifact@v4
        with:
          pattern: miner-*
          merge-multiple: true
          path: miner-out

      - name: Placer les programmes de minage dans l'application
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ ! -f miner-out/arm64-v8a-libccminer.so ]; then
            echo "ERREUR : la version 64 bits optimisée n'a pas pu être compilée."
            echo "Ouvre l'archive de journaux logs-arm64-v8a de l'étape précédente."
            exit 1
          fi
          for f in miner-out/*.so; do
            base="$(basename "$f")"
            abi="${base%%-lib*}"
            name="lib${base#*-lib}"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$f" "app/src/main/jniLibs/$abi/$name"
            echo "Placé : app/src/main/jniLibs/$abi/$name"
          done

      - name: Inscrire l'adresse VRSC dans l'application
        env:
          WALLET: ${{ inputs.wallet || vars.VRSC_WALLET }}
        run: |
          set -euo pipefail
          F=app/src/main/java/com/monchamp/verusfarm/Config.kt
          if [[ "$WALLET" =~ ^R[1-9A-HJ-NP-Za-km-z]{33}$ ]]; then
            sed -i "s|DEFAULT_WALLET = \"[^\"]*\"|DEFAULT_WALLET = \"$WALLET\"|" "$F"
            echo "Adresse VRSC inscrite dans l'application."
          else
            echo "::warning::Adresse VRSC absente ou invalide : l'application la demandera à la première ouverture."
          fi

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fabriquer l'application
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk VerusFarm.apk

      - name: Contrôler l'APK (signature, contenu, compatibilité)
        run: |
          set -uo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          {
            echo "## Contrôle de l'APK"
            echo '```'
            ls -l VerusFarm.apk
            "$BT/aapt2" dump badging VerusFarm.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label:)" || true
            echo "--- Signature ---"
            "$BT/apksigner" verify --verbose --print-certs VerusFarm.apk 2>&1 | head -n 15 || true
            echo "--- Bibliothèques natives ---"
            unzip -l VerusFarm.apk | grep -E "lib/" || true
            echo "--- Alignement ---"
            if "$BT/zipalign" -c 4 VerusFarm.apk; then echo "alignement OK"; else echo "alignement KO"; fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VerusFarm-apk
          path: VerusFarm.apk

      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="apk-${RUN}"
          {
            echo "Application VerusFarm avec programme de minage intégré."
            echo
            echo "Programmes de minage inclus :"
            ls app/src/main/jniLibs/*/ | sed 's/^/  /'
            echo
            echo "Code source de ccminer compilé (licence GPL-3.0) :"
            cat miner-out/*-source.txt | sort -u
          } > notes.md
          gh release create "$TAG" VerusFarm.apk --repo "$REPO" \
            --title "VerusFarm $TAG" --notes-file notes.md
          echo "APK publié : https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
