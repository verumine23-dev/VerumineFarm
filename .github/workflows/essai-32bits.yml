name: Essai 32 bits (Termux et compilateur récent)

# Expérience pour savoir si le code de minage peut être compilé pour les téléphones 32 bits.
# Rien n'est publié : on lit seulement le résumé de l'exécution.
#   Tâche 1 : compile ccminer dans un vrai Termux 32 bits (émulé), comme sur un téléphone.
#   Tâche 2 : essaie notre script avec un compilateur Android plus récent (NDK r27c).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  termux:
    name: Compiler dans Termux (32 bits, émulé)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Préparer l'émulation ARM 32 bits
        run: docker run --rm --privileged aptman/qus -s -- -p arm

      - name: Compiler ccminer comme sur un téléphone avec Termux
        run: |
          mkdir -p out && chmod 777 out
          cat > out/test.sh <<'EOS'
          #!/data/data/com.termux/files/usr/bin/bash
          set +e
          exec > >(tee /out/log.txt) 2>&1
          echo "== Machine =="; uname -m
          echo "== Installation des paquets (un par un) =="
          apt update
          for p in clang make autoconf automake libtool pkg-config git openssl libcurl libjansson binutils file; do
            apt install -yq "$p" || echo "PAQUET ABSENT OU ERREUR : $p"
          done
          echo "== Compilateur =="; clang --version
          RES="$(clang -print-resource-dir)"
          echo "== En-tête arm_neon.h : $RES/include/arm_neon.h =="
          grep -n "poly128_t\|vmull_p64\|vaeseq_u8" "$RES/include/arm_neon.h" | head -n 12
          cat > /tmp/probe.c <<'PROBE'
          #include <arm_neon.h>
          poly128_t t_mul(poly64_t a, poly64_t b) { return vmull_p64(a, b); }
          uint8x16_t t_aes(uint8x16_t a, uint8x16_t b) { return vaesmcq_u8(vaeseq_u8(a, b)); }
          PROBE
          echo "== Test des fonctions de chiffrement avec différentes options =="
          for cand in "" "-march=armv8-a+crypto" "-march=armv8-a+crypto -mfpu=crypto-neon-fp-armv8" "-mcpu=cortex-a53 -mfpu=crypto-neon-fp-armv8"; do
            echo "-- options : [$cand]"
            clang -c -x c /tmp/probe.c -o /tmp/probe.o $cand 2>&1 | head -n 3
            [ -f /tmp/probe.o ] && echo "   => COMPILE OK" && rm -f /tmp/probe.o
          done
          cd "$HOME"
          git clone --depth 1 https://github.com/Oink70/CCminer-ARM-optimized.git
          cd CCminer-ARM-optimized
          git rev-parse HEAD
          chmod +x build.sh configure.sh autogen.sh
          echo "== Compilation (build.sh) =="
          ./build.sh > /out/build.log 2>&1
          echo "code de sortie : $?"
          tail -n 40 /out/build.log
          if [ -f ccminer ]; then
            echo "== Résultat =="
            ls -l ccminer
            readelf -h ccminer | grep -E "Class|Machine"
            readelf -d ccminer | grep -E "NEEDED|RUNPATH|RPATH"
            echo "== Test du programme =="
            timeout 20 ./ccminer --version
            echo "code du test : $?"
            echo "== Options de compilation utilisées =="
            grep -E "^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|LIBS) =" Makefile
            echo "== Bibliothèques statiques disponibles =="
            ls "$PREFIX"/lib/*.a 2>/dev/null | grep -E "curl|ssl|crypto|jansson"
            cp ccminer /out/ccminer-termux-arm
          else
            echo "== Aucune compilation réussie =="
            grep -aE " error: |fatal error" /out/build.log | sort -u | head -n 40
          fi
          EOS
          chmod +x out/test.sh
          docker run --rm --privileged -v "$PWD/out:/out" ghcr.io/termux-user-repository/termux-docker:arm bash /out/test.sh || true

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Résultat de la compilation dans Termux (32 bits)"
            echo '```'
            tail -n 120 out/log.txt 2>/dev/null || echo "Pas de journal."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder les fichiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essai-termux-32bits
          path: out/*
          if-no-files-found: ignore

  ndk-recent:
    name: Compilateur Android récent (NDK r27c, 32 bits)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le NDK Android récent
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Installer les outils de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config make git

      - name: Examiner l'en-tête arm_neon.h du compilateur
        run: |
          TC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          H="$(ls "$TC"/lib/clang/*/include/arm_neon.h | head -n 1)"
          {
            echo "## En-tête arm_neon.h du NDK (r27c)"
            echo '```'
            "$TC/bin/clang" --version | head -n 1
            echo "$H"
            grep -n "poly128_t\|vmull_p64\|vaeseq_u8" "$H" | head -n 12
            echo "--- contexte de la définition de poly128_t ---"
            grep -n -B4 "typedef.*poly128_t" "$H" | head -n 20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Essayer la compilation 32 bits
        env:
          ABI: armeabi-v7a
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash miner/build-android.sh

      - name: Garder les fichiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essai-ndk27-32bits
          path: |
            miner/out/*
            miner/logs/*
          if-no-files-found: ignore
