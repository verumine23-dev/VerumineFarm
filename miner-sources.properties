# ==========================================================================
#  FACULTATIF : ce fichier ne sert que si tu compiles avec Android Studio.
#  Avec le flux de travail GitHub (.github/workflows/build.yml), laisse-le vide :
#  le programme de minage est intégré directement, sans téléchargement.
# ==========================================================================

# ==========================================================================
#  OÙ TÉLÉCHARGER LE PROGRAMME DE MINAGE
#  Ce fichier est lu automatiquement à chaque compilation (tâche fetchMiner).
#
#  Pour chaque ligne, remplis :
#    .url     = lien direct de téléchargement du fichier
#    .sha256  = empreinte SHA-256 du fichier (64 caractères)
#
#  L'empreinte est OBLIGATOIRE : elle prouve que le fichier téléchargé est bien
#  celui que tu attends. Si elle ne correspond pas, la compilation s'arrête.
#
#  Comment obtenir l'empreinte :
#    Windows : certutil -hashfile nom_du_fichier SHA256
#    Mac/Linux : sha256sum nom_du_fichier
#
#  Laisse une ligne vide pour ignorer ce fichier.
#  Astuce : après la compilation sur GitHub (dossier github-miner), copie ici le contenu de
#  miner-sources.generated.properties : les liens et les empreintes sont déjà remplis.
#  Le fichier est copié sous le bon nom dans app/src/main/jniLibs/<processeur>/
# ==========================================================================

# ---- Téléphones 64 bits (la grande majorité) ----
arm64-v8a.optimized.url=
arm64-v8a.optimized.sha256=
arm64-v8a.compat.url=
arm64-v8a.compat.sha256=

# ---- Téléphones 32 bits (petits modèles, Android Go) ----
armeabi-v7a.optimized.url=
armeabi-v7a.optimized.sha256=
armeabi-v7a.compat.url=
armeabi-v7a.compat.sha256=
